{% set version = "1.64.0" %}
{% set build = 0 %}

package:
  name: solara-suite
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/s/solara/solara-{{ version }}.tar.gz
    sha256: a10526ea08d34da849a63014075aea69046477e5d8eec64184100900fecc59fa
    folder: solara
  - url: https://pypi.org/packages/source/s/solara-ui/solara_ui-{{ version }}.tar.gz
    sha256: cd9e147fcbc9f17f5533caa2f1af8d2260f774cc8aae1d279c7c0ee6283fbce8
    folder: solara_ui
  - url: https://pypi.org/packages/source/s/solara-server/solara_server-{{ version }}.tar.gz
    sha256: 7da336cccf4fcd20f40790afbdfe96eaa36fffdcc2dda828b858244138a4d695
    folder: solara_server

build:
  noarch: python
  number: {{ build }}


outputs:
  - name: solara
    version: {{ version }}
    build:
      noarch: python
      script: |
        set -euxo pipefail
        cd solara
        python -m pip install -vv --no-deps .
    requirements:
      host:
        # FIXME: Remove pin - https://github.com/widgetti/solara/issues/1107
        - python {{ python_min }},<3.14
        - hatchling
        - pip
      run:
        - python >={{ python_min }}
        - solara-ui
        - solara-server
      run_constrained:
        # Can't use {{ pin_subpackage("solara-assets", exact=True) }}
        # as the hashes are different
        # TODO: revisit after https://github.com/conda-forge/staged-recipes/issues/23382
        - solara-assets ={{ version }}=*_{{ build }}
        - solara-server ={{ version }}=*_{{ build }}
        - solara-ui ={{ version }}=*_{{ build }}

    test:
      imports:
        - solara
      commands:
        - pip check
        - solara --help
      requires:
        - python {{ python_min }}
        - pip

  - name: solara-ui
    version: {{ version }}
    build:
      noarch: python
      script: |
        set -euxo pipefail
        cd solara_ui
        python -m pip install -vv --no-deps .
    requirements:
      host:
        - python {{ python_min }}
        - hatchling >=0.25
        - pip
      run:
        - python >={{ python_min }}
        - reacton >=1.9.0
        - ipywidgets >=7.7
        - ipyvuetify >=1.6.10
        - ipyvue >=1.9.0
        - requests
        - humanize
        # solara-ui optional dependencies follow
        - markdown
        - pymdown-extensions
        - pygments
        - cachetools
        - numpy
        - pillow

    test:
      imports:
        - solara
      commands:
        - pip check
      requires:
        - python {{ python_min }}
        - pip

  - name: solara-server
    version: {{ version }}
    build:
      noarch: python
      script: |
        set -euxo pipefail
        cd solara_server
        python -m pip install -vv --no-deps .
      entry_points:
        - solara = solara.__main__:main
    requirements:
      host:
        - python {{ python_min }}
        - hatchling >=0.25
        - pip
      run:
        - python >={{ python_min }}
        - jinja2
        - click >=7.1.0
        - rich-click
        - filelock
        - ipykernel
        - nbformat
        - jupyter_client >=7.0.0
        - solara-ui
        # solara-server optional dependencies follow
        - uvicorn
        - websockets
        - starlette
        - watchfiles
        - watchdog
      run_constrained:
        # Can't use {{ pin_subpackage("solara-assets", exact=True) }}
        # as the hashes are different
        # TODO: revisit after https://github.com/conda/conda-build/issues/4415
        - solara-assets ={{ version }}=*_{{ build }}
    test:
      imports:
        - solara
      commands:
        - pip check
        - solara --help
      requires:
        - python {{ python_min }}
        - pip

about:
  home: https://github.com/widgetti/solara
  summary: 'A Pure Python, React-style Framework for Scaling Your Jupyter and Web Apps'
  license: MIT AND BSD-3-Clause
  license_file:
    - solara/LICENSE
#    - solara/packages/solara-widget-manager/LICENSE.voila.txt

extra:
  feedstock-name: solara
  recipe-maintainers:
    - maartenbreddels
    - mariobuikhuizen
    - dhirschfeld
    - iisakkirotko
